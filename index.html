<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kanji Nepali Flash - Complete Dataset</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-secondary: #8E8E93;
            --accent-color: #007AFF;
            --success-color: #34C759;
            --danger-color: #FF3B30;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --border-radius: 18px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-secondary: #AEA9B1;
            --accent-color: #0A84FF;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        .app-container {
            max-width: 390px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
        }

        header { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand h1 { margin: 0; font-size: 18px; font-weight: 700; }
        .brand p { margin: 0; font-size: 11px; color: var(--text-secondary); }

        .nav-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--card-bg);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            color: var(--text-main);
        }

        .progress-wrapper { padding: 0 20px 8px; }
        .progress-bar-bg { background: #E5E5EA; height: 4px; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-color); width: 0%; transition: width 0.3s; }
        .progress-stats { display: flex; justify-content: space-between; font-size: 10px; margin-top: 4px; color: var(--text-secondary); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            perspective: 1000px;
            overflow: hidden;
        }

        .card-container {
            width: 100%;
            height: 100%;
            max-height: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card-container.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-back { 
            transform: rotateY(180deg); 
            -webkit-transform: rotateY(180deg);
            justify-content: flex-start; 
            align-items: flex-start;
            text-align: left;
            overflow-y: auto; 
        }

        .kanji-display { font-size: 90px; font-weight: bold; }
        .tap-hint { font-size: 11px; color: var(--text-secondary); margin-top: 14px; text-transform: uppercase; letter-spacing: 0.5px; }

        .back-section { width: 100%; margin-bottom: 8px; }
        .label { font-size: 9px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px; }
        .value { font-size: 14px; color: var(--text-main); font-weight: 500; }
        .nepali-val { color: var(--accent-color); font-weight: 600; font-size: 16px; }
        
        .compounds-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
            margin-top: 4px;
        }
        .compound-item {
            background: rgba(0,122,255,0.05);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 11px;
        }
        .compound-word { font-weight: 600; color: var(--text-main); }
        .compound-meaning { font-size: 10px; color: var(--text-secondary); }

        .swipe-hint {
            padding: 8px 20px 16px;
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-end;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-height: 85vh;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            overflow-y: auto;
        }

        .form-input {
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd;
            background: var(--bg-color); color: var(--text-main); font-size: 14px;
        }

        .btn {
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary { background: var(--accent-color); color: white; }
        .btn-secondary { background: var(--card-bg); color: var(--text-main); box-shadow: var(--shadow); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">
            <h1>漢字 Flash</h1>
            <p>नेपाली व्याख्या & Swipe</p>
        </div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="toggleTheme()">🌓</button>
            <button class="icon-btn" onclick="openPanel('settings-panel')">⚙️</button>
            <button class="icon-btn" onclick="openPanel('list-panel')">📚</button>
        </div>
    </header>

    <div class="progress-wrapper">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-stats">
            <span id="progress-text">Card: 0/0</span>
            <span id="percentage-text">0%</span>
        </div>
    </div>

    <main id="main-area">
        <div class="card-container" id="flashcard" onclick="flipCard()">
            <div class="card-face card-front">
                <div class="kanji-display" id="f-kanji">...</div>
                <div class="tap-hint">Tap to Flip</div>
            </div>
            <div class="card-face card-back">
                <div class="back-section">
                    <div class="label">Meaning (नेपाली)</div>
                    <div class="value nepali-val" id="b-meaning">...</div>
                </div>
                <div class="back-section" style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <div class="label">On'yomi</div>
                        <div class="value" id="b-onyomi" style="font-size: 11px;">...</div>
                    </div>
                    <div style="flex:1;">
                        <div class="label">Kun'yomi</div>
                        <div class="value" id="b-kunyomi" style="font-size: 11px;">...</div>
                    </div>
                </div>
                <div class="back-section" style="flex:1; overflow-y: auto; max-height: 140px;">
                    <div class="label">Related Words (Compounds)</div>
                    <div class="compounds-grid" id="b-compounds"></div>
                </div>
                <div style="display:flex; gap:8px; width:100%; margin-top:8px;">
                    <button class="btn btn-secondary" style="flex:1; font-size: 11px; padding: 6px;" onclick="speakKanji(event)">🔊 Listen</button>
                </div>
            </div>
        </div>
    </main>

    <div class="swipe-hint">
        ← Swipe Left/Right to Navigate Card →
    </div>

    <!-- Library Modal -->
    <div id="list-panel" class="modal"><div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;"><h2>Library</h2><button onclick="closePanels()" style="background:none; border:none; font-size:20px;">✕</button></div>
        <div id="kanji-list" style="margin-top:15px; display:flex; flex-direction:column; gap:8px;"></div>
    </div></div>

    <!-- Add New Modal -->
    <div id="add-panel" class="modal"><div class="modal-content">
        <h2>Add Kanji</h2>
        <form id="kanji-form" onsubmit="saveKanji(event)">
            <input type="text" id="in-kanji" placeholder="Kanji" required class="form-input">
            <input type="text" id="in-meaning" placeholder="Nepali Meaning" required class="form-input">
            <input type="text" id="in-onyomi" placeholder="On'yomi" class="form-input">
            <input type="text" id="in-kunyomi" placeholder="Kun'yomi" class="form-input">
            <button type="submit" class="btn btn-primary" style="width:100%">Save to Database</button>
            <button type="button" class="btn btn-secondary" onclick="closePanels()" style="width:100%; margin-top:8px;">Cancel</button>
        </form>
    </div></div>

    <!-- Settings Modal -->
    <div id="settings-panel" class="modal"><div class="modal-content">
        <h2>Settings</h2>
        <button class="btn btn-primary" onclick="openAddFromSettings()" style="width:100%; margin-bottom:12px;">Add New Kanji ➕</button>
        <button class="btn btn-secondary" onclick="exportData()" style="width:100%; margin-bottom:10px;">Export JSON</button>
        <button class="btn btn-secondary" onclick="confirmResetAllData()" style="width:100%; color:red; border: 1px solid rgba(255,0,0,0.2);">Reset to Default Dataset</button>
        <button class="btn btn-secondary" onclick="closePanels()" style="width:100%; margin-top:20px;">Close</button>
    </div></div>

    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="modal"><div class="modal-content" style="text-align: center; padding: 30px 20px;">
        <h3 id="confirm-title" style="margin-top: 0; margin-bottom: 10px;">Are you sure?</h3>
        <p id="confirm-msg" style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">This action cannot be undone.</p>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="closeConfirmModal(false)">Cancel</button>
            <button class="btn btn-primary" id="confirm-ok-btn" style="flex: 1; background: var(--danger-color);" onclick="closeConfirmModal(true)">Confirm</button>
        </div>
    </div></div>
</div>

        "路": { meaning: "बाटो / सडक", onyomi: "ロ", kunyomi: "みち", compounds: [{ word: "道路 (どうろ)", meaning: "सडक / मार्ग" }, { word: "線路 (せんろ)", meaning: "रेलवे ट्र्याक" }, { word: "通路 (つうろ)", meaning: "आउजाउ गर्ने बाटो" }, { word: "経路 (けいろ)", meaning: "मार्ग / बाटो" }] },
        "連": { meaning: "जोड्नु / सँगै लैजानु", onyomi: "レン", kunyomi: "つ・れる, つら・ねる", compounds: [{ word: "連絡 (れんらく)", meaning: "सम्पर्क" }, { word: "連続 (れんぞく)", meaning: "निरन्तर" }, { word: "連盟 (れんめい)", meaning: "सङ्घ / फेडरेसन" }, { word: "連休 (れんきゅう)", meaning: "लामो छुट्टिको अवधि" }] },
        "練": { meaning: "अभ्यास गर्नु / तिखार्नु", onyomi: "レン", kunyomi: "ね・る", compounds: [{ word: "練習 (れんしゅう)", meaning: "अभ्यास" }, { word: "訓練 (くんれん)", meaning: "तालिम" }, { word: "熟練 (じゅくれん)", meaning: "कुशलता" }, { word: "練乳 (れんにゅう)", meaning: "कनडन्स्ड मिल्क" }] },
        "恋": { meaning: "प्रेम / माया", onyomi: "レン", kunyomi: "こい, こ・いしい", compounds: [{ word: "恋愛 (れんあい)", meaning: "प्रेम सम्बन्ध" }, { word: "恋人 (こいびโต)", meaning: "प्रेमी / प्रेमिका" }, { word: "恋しい (こいしい)", meaning: "याद आउने / प्रिय" }, { word: "失恋 (しつれん)", meaning: "प्रेममा धोका" }] },
        "列": { meaning: "पङ्क्ति / लाइन", onyomi: "レツ", kunyomi: "", compounds: [{ word: "行列 (ぎょうれつ)", meaning: "लाइन / जुलुस" }, { word: "列車 (れっしゃ)", meaning: "ट्रेन" }, { word: "列島 (れっとう)", meaning: "टापुहरूको समूह" }, { word: "列記 (れっき)", meaning: "सूचीबद्ध गर्नु" }] },
        "歴": { meaning: "इतिहास / पृष्ठभूमि", onyomi: "レキ", kunyomi: "", compounds: [{ word: "歴史 (れきし)", meaning: "इतिहास" }, { word: "経歴 (けいれき)", meaning: "व्यक्तिगत पृष्ठभूमि / बायोडाटा" }, { word: "学歴 (がくれき)", meaning: "शैक्षिक योग्यता" }, { word: "歴代 (れきだい)", meaning: "उत्तराधिकारका पूर्ववर्ती" }] },
        "齢": { meaning: "उमेर", onyomi: "レイ", kunyomi: "よわい", compounds: [{ word: "年齢 (ねんれい)", meaning: "उमेर" }, { word: "高齢 (こうれい)", meaning: "उमेर ढल्किएको" }, { word: "高年齢 (こうねんれい)", meaning: "वृद्ध वर्ग" }, { word: "同齢 (どうれい)", meaning: "उस्तै उमेरको" }] }
    };

    let kanjiData = [];
    let currentIndex = 0;
    let isFlipped = false;
    let touchStartX = 0;
    let touchEndX = 0;
    let confirmCallback = null;

    window.onload = () => {
        try {
            const saved = localStorage.getItem('kanji_custom_database_v6');
            if (saved) {
                kanjiData = JSON.parse(saved);
            } else {
                kanjiData = rawKanjiList.map((k, index) => {
                    const dictEntry = detailedKanjiDictionary[k];
                    if (dictEntry) {
                        return {
                            id: index + 1,
                            kanji: k,
                            meaning: dictEntry.meaning,
                            onyomi: dictEntry.onyomi,
                            kunyomi: dictEntry.kunyomi || '—',
                            compounds: dictEntry.compounds
                        };
                    } else {
                        return {
                            id: index + 1,
                            kanji: k,
                            meaning: `नेपाली अर्थ (${k})`,
                            onyomi: "オン",
                            kunyomi: "くん",
                            compounds: [
                                { word: k + "語一", meaning: "उदाहरण १" },
                                { word: k + "語二", meaning: "उदाहरण २" },
                                { word: k + "語三", meaning: "उदाहरण ३" },
                                { word: k + "語四", meaning: "उदाहरण ४" }
                            ]
                        };
                    }
                });
                localStorage.setItem('kanji_custom_database_v6', JSON.stringify(kanjiData));
            }
        } catch (err) {
            console.error("Storage parsing error, loading default:", err);
            kanjiData = rawKanjiList.map((k, index) => ({
                id: index + 1,
                kanji: k,
                meaning: `अर्थ (${k})`,
                onyomi: "オン",
                kunyomi: "くん",
                compounds: []
            }));
        }
        updateUI();

        const mainArea = document.getElementById('main-area');
        if (mainArea) {
            mainArea.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});

            mainArea.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, {passive: true});
        }
    };

    function handleSwipe() {
        const threshold = 50;
        if (touchEndX < touchStartX - threshold) {
            nextCard();
        }
        if (touchEndX > touchStartX + threshold) {
            prevCard();
        }
    }

    function updateUI() {
        if (kanjiData.length === 0) return;
        const card = kanjiData[currentIndex];
        
        document.getElementById('f-kanji').innerText = card.kanji;
        document.getElementById('b-meaning').innerText = card.meaning;
        document.getElementById('b-onyomi').innerText = card.onyomi || '—';
        document.getElementById('b-kunyomi').innerText = card.kunyomi || '—';

        const compContainer = document.getElementById('b-compounds');
        compContainer.innerHTML = (card.compounds || []).map(c => `
            <div class="compound-item">
                <div class="compound-word">${c.word}</div>
                <div class="compound-meaning">${c.meaning}</div>
            </div>
        `).join('');

        const progress = ((currentIndex + 1) / kanjiData.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;
        document.getElementById('progress-text').innerText = `Card: ${currentIndex + 1} / ${kanjiData.length}`;
        document.getElementById('percentage-text').innerText = `${Math.round(progress)}%`;

        isFlipped = false;
        document.getElementById('flashcard').classList.remove('is-flipped');
    }

    function flipCard() {
        isFlipped = !isFlipped;
        document.getElementById('flashcard').classList.toggle('is-flipped', isFlipped);
    }

    function nextCard() { 
        if (currentIndex < kanjiData.length - 1) { 
            currentIndex++; 
            updateUI(); 
        } 
    }
    
    function prevCard() { 
        if (currentIndex > 0) { 
            currentIndex--; 
            updateUI(); 
        } 
    }

    function openPanel(id) { 
        if(id === 'list-panel') {
            const list = document.getElementById('kanji-list');
            list.innerHTML = kanjiData.map(k => `<div style="background:var(--bg-color); padding:10px; border-radius:8px; display:flex; justify-content:space-between; font-size:13px;"><b>${k.kanji}</b> <span>${k.meaning}</span></div>`).join('');
        }
        document.getElementById(id).classList.add('active'); 
    }
    
    function openAddFromSettings() {
        closePanels();
        openPanel('add-panel');
    }

    function saveKanji(e) {
        e.preventDefault();
        const newCard = {
            id: Date.now(),
            kanji: document.getElementById('in-kanji').value,
            meaning: document.getElementById('in-meaning').value,
            onyomi: document.getElementById('in-onyomi').value,
            kunyomi: document.getElementById('in-kunyomi').value,
            compounds: [
                {"word": "関連語1", "meaning": "शब्द १"},
                {"word": "関連語2", "meaning": "शब्द २"},
                {"word": "関連語3", "meaning": "शब्द ३"},
                {"word": "関連語4", "meaning": "शब्द ४"}
            ]
        };
        kanjiData.unshift(newCard);
        localStorage.setItem('kanji_custom_database_v6', JSON.stringify(kanjiData));
        currentIndex = 0;
        updateUI();
        closePanels();
    }

    function closePanels() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function speakKanji(e) {
        e.stopPropagation();
        const card = kanjiData[currentIndex];
        if (!card) return;
        try {
            const utterance = new SpeechSynthesisUtterance(card.kanji);
            utterance.lang = 'ja-JP';
            window.speechSynthesis.speak(utterance);
        } catch(err) {
            console.warn("Speech synthesis not supported or failed:", err);
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(kanjiData));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "kanji_nepali_custom.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function showCustomConfirm(title, msg, onConfirm) {
        document.getElementById('confirm-title').innerText = title;
        document.getElementById('confirm-msg').innerText = msg;
        confirmCallback = onConfirm;
        document.getElementById('confirm-modal').classList.add('active');
    }

    function closeConfirmModal(result) {
        document.getElementById('confirm-modal').classList.remove('active');
        if (result && typeof confirmCallback === 'function') {
            confirmCallback();
        }
        confirmCallback = null;
    }

    function confirmResetAllData() { 
        showCustomConfirm(
            "Reset Database", 
            "Are you sure you want to restore the default kanji list? Any custom additions will be reset.", 
            () => {
                localStorage.removeItem('kanji_custom_database_v6'); 
                location.reload();
            }
        );
    }
</script>
</body>
</html>
